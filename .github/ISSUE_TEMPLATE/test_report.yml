name: Test report
description: A run on your hardware for one commit or pull request. Numbers are the most useful thing you can give us.
title: "test: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. One report per commit or PR, so results can be compared. No game
        files, game-content screenshots or hashes of game data, please
        ([docs/asset-policy.md](https://github.com/pablogonz12/Scarlight/blob/main/docs/asset-policy.md)).
  - type: input
    id: commit
    attributes:
      label: Commit or PR
      placeholder: PR #42 / fcb278b / pr/repo-polish
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build command and features
      placeholder: cargo xwin build --release -p victory (no diagnostics)
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: RX 9070 XT, Mesa RADV 25.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and how it runs
      placeholder: CachyOS, GE-Proton11-14 through wine
    validations:
      required: true
  - type: input
    id: vkd3d
    attributes:
      label: vkd3d-proton version
      placeholder: master
    validations:
      required: true
  - type: input
    id: cpuram
    attributes:
      label: CPU and RAM
      placeholder: Ryzen 9 9900X, 30 GB
  - type: dropdown
    id: result
    attributes:
      label: Crash
      options:
        - No crash, ran and exited cleanly
        - No crash, still running when I stopped it
        - Crash or device removed
        - Hang
        - Would not boot
    validations:
      required: true
  - type: input
    id: minutes
    attributes:
      label: Minutes run
      description: Wall-clock time from start to crash or stop.
      placeholder: "25"
    validations:
      required: true
  - type: input
    id: fps
    attributes:
      label: Frame rate
      description: Menu and world fps if you have both, plus where you measured.
      placeholder: Menus 30 fps, world 0.4 fps in the opening area
    validations:
      required: true
  - type: input
    id: shaders
    attributes:
      label: Offline shader count (optional)
      description: If you ran the offline translation check, e.g. `cargo test -p victory-shader --locked`.
      placeholder: "692 of 751 world shaders translate; all valid SPIR-V"
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: What rendered, what was black, warnings worth reading, anything that changed against main.
    validations:
      required: true
  - type: checkboxes
    id: policy
    attributes:
      label: Asset policy
      options:
        - label: This report contains no game files, no screenshots of game content and no hashes of game data.
          required: true
